<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting Card</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .greeting-card {
            width: 400px;
            height: 300px;
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border-radius: 20px;
            box-shadow: 
                20px 20px 40px rgba(0, 0, 0, 0.1),
                -20px -20px 40px rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .greeting-card:hover {
            transform: translateY(-5px);
        }

        .greeting-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
        }

        .greeting-text {
            font-size: 2.5em;
            color: #333;
            text-align: center;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 2;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .greeting-subtitle {
            font-size: 1.2em;
            color: #666;
            text-align: center;
            margin-top: 20px;
            font-style: italic;
            position: relative;
            z-index: 2;
        }

        .decorative-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            color: #ffd700;
            font-size: 1.5em;
            opacity: 0.7;
            animation: twinkle 2s ease-in-out infinite alternate;
        }

        .star:nth-child(1) { top: 20px; left: 30px; animation-delay: 0.5s; }
        .star:nth-child(2) { top: 40px; right: 40px; animation-delay: 1s; }
        .star:nth-child(3) { bottom: 50px; left: 50px; animation-delay: 1.5s; }
        .star:nth-child(4) { bottom: 30px; right: 30px; animation-delay: 2s; }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="greeting-card">
        <div class="decorative-elements">
            <div class="star">✨</div>
            <div class="star">⭐</div>
            <div class="star">✨</div>
            <div class="star">⭐</div>
        </div>
        <h1 class="greeting-text">Hello There</h1>
        <p class="greeting-subtitle">A warm greeting just for you!</p>
    </div>
</body>
</html>

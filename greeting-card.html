<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World Greeting Card</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .greeting-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            text-align: center;
            max-width: 400px;
            position: relative;
            overflow: hidden;
        }

        .greeting-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.1) 0%, transparent 70%);
            animation: sparkle 3s ease-in-out infinite;
        }

        .card-content {
            position: relative;
            z-index: 1;
        }

        .hello-world {
            font-size: 3em;
            color: #333;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            animation: glow 2s ease-in-out infinite alternate;
        }

        .message {
            font-size: 1.2em;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .decorative-border {
            border: 3px solid transparent;
            border-image: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57) 1;
            padding: 10px;
            border-radius: 15px;
        }

        .emoji-decoration {
            font-size: 2em;
            margin: 0 10px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes glow {
            from {
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            }
            to {
                text-shadow: 2px 2px 20px rgba(255, 215, 0, 0.6);
            }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: rotate(180deg);
            }
        }

        .interactive-button {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .interactive-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="greeting-card">
        <div class="card-content">
            <div class="decorative-border">
                <div class="emoji-decoration">🌟</div>
                <h1 class="hello-world">Hello World!</h1>
                <div class="emoji-decoration">🌟</div>
            </div>
            
            <p class="message">
                Welcome to this beautiful greeting card!<br>
                A simple "Hello World" message<br>
                created with love and code. ❤️
            </p>
            
            <button class="interactive-button" onclick="showMessage()">
                Click for a Surprise! ✨
            </button>
            
            <div id="surprise-message" style="display: none; margin-top: 20px; color: #ff6b6b; font-weight: bold;">
                🎉 Congratulations! You've just experienced your first interactive greeting card! 🎉
            </div>
        </div>
    </div>

    <script>
        function showMessage() {
            const surpriseMsg = document.getElementById('surprise-message');
            const button = document.querySelector('.interactive-button');
            
            if (surpriseMsg.style.display === 'none') {
                surpriseMsg.style.display = 'block';
                button.textContent = 'Hide Surprise! 🙈';
                
                // Add a little celebration effect
                button.style.background = 'linear-gradient(45deg, #4ecdc4, #45b7d1)';
            } else {
                surpriseMsg.style.display = 'none';
                button.innerHTML = 'Click for a Surprise! ✨';
                button.style.background = 'linear-gradient(45deg, #ff6b6b, #4ecdc4)';
            }
        }

        // Add some automatic sparkle effects
        setInterval(() => {
            const card = document.querySelector('.greeting-card');
            card.style.transform = `scale(${1 + Math.sin(Date.now() / 1000) * 0.02})`;
        }, 100);
    </script>
</body>
</html>

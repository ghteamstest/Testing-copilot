<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting Card</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .greeting-card {
            background: #ffffff;
            width: 400px;
            height: 300px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .greeting-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            opacity: 0.1;
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .greeting-text {
            font-size: 2.5em;
            color: #2c3e50;
            margin: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            z-index: 1;
            position: relative;
        }

        .decoration {
            font-size: 3em;
            color: #e74c3c;
            margin: 10px 0;
            z-index: 1;
            position: relative;
        }

        .subtitle {
            font-size: 1.2em;
            color: #7f8c8d;
            font-style: italic;
            z-index: 1;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="greeting-card">
        <div class="decoration">🌟</div>
        <div class="greeting-text">Hello There</div>
        <div class="subtitle">Wishing you a wonderful day!</div>
        <div class="decoration">🌟</div>
    </div>
</body>
</html>

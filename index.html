<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Testing Copilot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Settings</h1>
        <div class="settings-panel">
            <form id="settingsForm">
                <div class="setting-group">
                    <label for="theme">Theme:</label>
                    <select id="theme" name="theme">
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                        <option value="auto">Auto</option>
                    </select>
                </div>
                
                <div class="setting-group">
                    <label for="notifications">Enable Notifications:</label>
                    <input type="checkbox" id="notifications" name="notifications" checked>
                </div>
                
                <div class="setting-group">
                    <label for="language">Language:</label>
                    <select id="language" name="language">
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                    </select>
                </div>
                
                <div class="setting-group">
                    <label for="autoSave">Auto-save interval (seconds):</label>
                    <input type="number" id="autoSave" name="autoSave" min="10" max="300" value="30">
                </div>
                
                <div class="button-group">
                    <button type="submit" id="saveBtn">Save Settings</button>
                    <button type="button" id="resetBtn">Reset to Defaults</button>
                </div>
            </form>
            
            <div id="status" class="status-message"></div>
        </div>
    </div>
    
    <script src="settings.js"></script>
</body>
</html>
